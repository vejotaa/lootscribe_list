name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: lootscribe_list
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lootscribe_list.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          PKG_NAME="lootscribe_list-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "release/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release/${PKG_NAME}/"
          cp README.md "release/${PKG_NAME}/"
          [[ -f .env.example ]] && cp .env.example "release/${PKG_NAME}/"

          cd release
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          else
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          fi
          rm -rf "${PKG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
